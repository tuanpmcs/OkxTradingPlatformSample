<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulse Web Console</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="panel header">
        <h1>Pulse Web Console</h1>
        <p>Gateway mode streams market ticks from backend and predicts via C++ inference proxy.</p>
      </section>

      <section class="panel controls">
        <div class="row">
          <label for="symbol">Symbol</label>
          <input id="symbol" value="BTC-USDT" />
        </div>
        <div class="row">
          <label for="gateway-url">Gateway URL</label>
          <input id="gateway-url" value="http://127.0.0.1:8080" />
        </div>
        <div class="row toggle">
          <label for="gateway-mode">Gateway Mode</label>
          <input id="gateway-mode" type="checkbox" checked />
        </div>
        <div class="row">
          <label for="model-type">Model</label>
          <select id="model-type">
            <option value="xgboost">xgboost</option>
            <option value="lstm">lstm</option>
            <option value="cnn">cnn</option>
            <option value="transformer">transformer</option>
          </select>
        </div>
        <div class="row actions">
          <button id="start-btn">Start Stream</button>
          <button id="stop-btn">Stop</button>
          <button id="health-btn">Check Gateway</button>
        </div>
      </section>

      <section class="panel stats">
        <div class="stat">
          <span class="label">State</span>
          <span id="state" class="value">idle</span>
        </div>
        <div class="stat">
          <span class="label">Last Price</span>
          <span id="price" class="value">-</span>
        </div>
        <div class="stat">
          <span class="label">Signal</span>
          <span id="signal" class="value">-</span>
        </div>
        <div class="stat">
          <span class="label">Pred Return</span>
          <span id="pred-ret" class="value">-</span>
        </div>
      </section>

      <section class="panel chart">
        <div class="chart-wrap">
          <canvas id="chart" width="1200" height="380"></canvas>
          <div id="chart-meta" class="chart-meta">Waiting for market stream...</div>
        </div>
      </section>

      <section class="panel log">
        <pre id="log"></pre>
      </section>
    </main>

    <script src="./main.js"></script>
  </body>
  </html>
