services:
  # Level 2 runtime: local Python inference behind gRPC.
  inference-python:
    build:
      context: ../../
      dockerfile: deploy/containers/Dockerfile.inference-python
      args:
        INSTALL_PROFILE: inference
    image: okx-trading/inference-python:local
    container_name: inference-python
    environment:
      MODEL_PATH: ${MODEL_PATH:-/app/models/pulse_xgboost_v1.joblib}
      MODEL_DIR_PATH: ${MODEL_DIR_PATH:-/app/models}
    volumes:
      - ../../models:/app/models:ro
    ports:
      - "50061:50061"
    profiles:
      - runtime
    restart: unless-stopped

  # Level 2 runtime: C++ ingest + feature builder + strategy stream.
  backend-cpp:
    build:
      context: ../../
      dockerfile: deploy/containers/Dockerfile.backend-cpp
    image: okx-trading/backend-cpp:local
    container_name: backend-cpp
    command:
      - "--grpc-port"
      - "50051"
      - "--config"
      - "/opt/app/configs/okx_public.yaml"
      - "--inference-mode"
      - "grpc"
      - "--inference-grpc-target"
      - "inference-python:50061"
      - "--inference-model-type"
      - "${INFERENCE_MODEL_TYPE:-xgboost}"
      - "--inference-horizon-sec"
      - "${INFERENCE_HORIZON_SEC:-30}"
      - "--inference-timeout-ms"
      - "${INFERENCE_TIMEOUT_MS:-1200}"
      - "--inference-interval-ms"
      - "${INFERENCE_INTERVAL_MS:-200}"
      - "--inference-min-points"
      - "${INFERENCE_MIN_POINTS:-32}"
    volumes:
      - ../../backend/configs:/opt/app/configs:ro
    ports:
      - "50051:50051"
    profiles:
      - runtime
    depends_on:
      - inference-python
    restart: unless-stopped

  # HTTP adapter for web clients and external tools.
  web-gateway:
    build:
      context: ../../
      dockerfile: deploy/containers/Dockerfile.web-gateway
    image: okx-trading/web-gateway:local
    container_name: web-gateway
    environment:
      PORT: "8080"
      PRED_GRPC_TARGET: backend-cpp:50051
      MARKET_GRPC_TARGET: backend-cpp:50051
    ports:
      - "8080:8080"
    profiles:
      - runtime
    depends_on:
      - inference-python
    restart: unless-stopped

  # Browser-first UI (independent). Runs local simulation by default.
  frontend-web:
    build:
      context: ../../
      dockerfile: deploy/containers/Dockerfile.web-frontend
    image: okx-trading/frontend-web:local
    container_name: frontend-web
    environment:
      HOST: "0.0.0.0"
      PORT: "5173"
    ports:
      - "5173:5173"
    profiles:
      - ui
    depends_on:
      - web-gateway
    restart: unless-stopped

  # C++ collector backend: same parser/feature path, but writes CSV and exits after duration.
  backend-cpp-collector:
    build:
      context: ../../
      dockerfile: deploy/containers/Dockerfile.backend-cpp
    image: okx-trading/backend-cpp:local
    container_name: backend-cpp-collector
    command:
      - "--disable-grpc"
      - "--csv-out"
      - "/data/books_trades_btcusdt"
      - "--duration-sec"
      - "${COLLECT_DURATION_SEC:-600}"
      - "--trace-stream"
    volumes:
      - ../../data:/data
    profiles:
      - training

  # Python training step: creates future labels from feature rows.
  label-maker:
    build:
      context: ../../
      dockerfile: deploy/containers/Dockerfile.inference-python
      args:
        INSTALL_PROFILE: inference
    image: okx-trading/inference-python:local
    container_name: label-maker
    command:
      - "python"
      - "ml_pipeline/data/build_labels.py"
      - "--features-csv"
      - "${FEATURES_CSV:-/app/data/books_trades_btcusdt.features.csv}"
      - "--horizon-sec"
      - "${LABEL_HORIZON_SEC:-30}"
      - "--horizon-ms"
      - "${LABEL_HORIZON_MS:-100}"
      - "--eps"
      - "${LABEL_EPS:-0.0001}"
      - "--spread-eps-multiplier"
      - "${LABEL_SPREAD_EPS_MULTIPLIER:-0.3}"
      - "--output-pattern"
      - "${LABEL_OUTPUT_PATTERN:-full}"
      - "--out-csv"
      - "${TRAIN_DATASET_CSV:-/app/data/train_dataset_btcusdt_h30.csv}"
    volumes:
      - ../../data:/app/data
    profiles:
      - training
    # depends_on:
    #   backend-cpp-collector:
    #     condition: service_completed_successfully

  # Python training step: trains/evaluates model artifacts for runtime inference.
  model-trainer:
    build:
      context: ../../
      dockerfile: deploy/containers/Dockerfile.inference-python
      args:
        INSTALL_PROFILE: training
    image: okx-trading/trainer-python:local
    container_name: model-trainer
    command:
      - "python"
      - "ml_pipeline/models/train_xgb.py"
      - "--dataset-csv"
      - "${TRAIN_DATASET_CSV:-/app/data/train_dataset_btcusdt_h30.csv}"
      - "--model-out-dir"
      - "${MODEL_OUT_DIR:-/app/models}"
      - "--horizon-sec"
      - "${LABEL_HORIZON_SEC:-30}"
      - "--label-eps"
      - "${LABEL_EPS:-0.0001}"
      - "--model-types"
      - "${TRAIN_MODEL_TYPES:-xgboost,lstm,cnn}"
      - "--task"
      - "${TRAIN_TASK:-regression}"
      - "--metrics-out-csv"
      - "${TRAIN_METRICS_CSV:-/app/data/train_metrics_btcusdt_h30.csv}"
      - "--best-model-out"
      - "${BEST_MODEL_OUT:-/app/models/pulse_best_model.artifact}"
      - "--min-rows"
      - "${TRAIN_MIN_ROWS:-500}"
    volumes:
      - ../../data:/app/data
      - ../../models:/app/models
    profiles:
      - training
    # depends_on:
    #   label-maker:
    #     condition: service_completed_successfully
