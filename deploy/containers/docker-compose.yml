services:
  backend-cpp:
    build:
      context: ../../
      dockerfile: deploy/containers/Dockerfile.backend-cpp
    image: okx-trading/backend-cpp:local
    container_name: backend-cpp
    ports:
      - "50051:50051"
    restart: unless-stopped

  inference-python:
    build:
      context: ../../
      dockerfile: deploy/containers/Dockerfile.inference-python
    image: okx-trading/inference-python:local
    container_name: inference-python
    environment:
      MODEL_PATH: /app/models/pulse_tree_v1.joblib
    volumes:
      - ../../models:/app/models:ro
    ports:
      - "50061:50061"
    depends_on:
      - backend-cpp
    restart: unless-stopped

  web-gateway:
    build:
      context: ../../
      dockerfile: deploy/containers/Dockerfile.web-gateway
    image: okx-trading/web-gateway:local
    container_name: web-gateway
    environment:
      PORT: "8080"
      PRED_GRPC_TARGET: inference-python:50061
    ports:
      - "8080:8080"
    depends_on:
      - inference-python
    restart: unless-stopped
