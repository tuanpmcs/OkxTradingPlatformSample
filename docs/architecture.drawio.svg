<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">OKX Trading Platform Sample Architecture</title>
  <desc id="desc">Architecture diagram showing OKX WebSocket feeding a C plus plus backend, with Electron desktop consuming the gRPC stream, Python inference service serving predictions, and a web gateway exposing HTTP endpoints.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .label { font: 600 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .sub { font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .box { stroke-width: 2; rx: 18; ry: 18; }
      .edge { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>
  <rect x="300" y="90" width="860" height="430" rx="24" ry="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="330" y="125" class="label">Docker Compose Services</text>

  <rect x="40" y="140" width="220" height="92" class="box" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="150" y="176" text-anchor="middle" class="label" font-size="22">OKX WebSocket</text>
  <text x="150" y="205" text-anchor="middle" class="sub">Public / Business Channels</text>

  <rect x="360" y="140" width="250" height="122" class="box" fill="#dcfce7" stroke="#4ade80"/>
  <text x="485" y="176" text-anchor="middle" class="label" font-size="22">backend-cpp</text>
  <text x="485" y="205" text-anchor="middle" class="sub">OKX WS -&gt; gRPC stream</text>
  <text x="485" y="232" text-anchor="middle" class="small">bind inside container: 0.0.0.0:50051</text>

  <rect x="720" y="140" width="250" height="122" class="box" fill="#ffedd5" stroke="#fb923c"/>
  <text x="845" y="176" text-anchor="middle" class="label" font-size="22">inference-python</text>
  <text x="845" y="205" text-anchor="middle" class="sub">PredictionService.Predict</text>
  <text x="845" y="232" text-anchor="middle" class="small">gRPC :50061</text>

  <rect x="720" y="330" width="250" height="110" class="box" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="845" y="366" text-anchor="middle" class="label" font-size="22">web-gateway</text>
  <text x="845" y="395" text-anchor="middle" class="sub">HTTP /health, /predict</text>
  <text x="845" y="422" text-anchor="middle" class="small">127.0.0.1:8080</text>

  <rect x="360" y="330" width="270" height="122" class="box" fill="#fee2e2" stroke="#f87171"/>
  <text x="495" y="366" text-anchor="middle" class="label" font-size="22">Electron Desktop</text>
  <text x="495" y="395" text-anchor="middle" class="sub">stream UI + charts + simulator</text>
  <text x="495" y="422" text-anchor="middle" class="small">connects to grpc://127.0.0.1:50051</text>

  <rect x="40" y="340" width="220" height="92" class="box" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="150" y="376" text-anchor="middle" class="label" font-size="22">Browser / curl</text>
  <text x="150" y="405" text-anchor="middle" class="sub">tests the HTTP gateway</text>

  <line x1="260" y1="186" x2="360" y2="186" class="edge"/>
  <line x1="495" y1="262" x2="495" y2="330" class="edge"/>
  <line x1="630" y1="370" x2="720" y2="220" class="edge"/>
  <line x1="260" y1="386" x2="720" y2="386" class="edge"/>
  <line x1="845" y1="330" x2="845" y2="262" class="edge"/>

  <text x="310" y="170" class="small">market events</text>
  <text x="514" y="303" class="small">MarketData.Subscribe</text>
  <text x="612" y="300" class="small">Predict</text>
  <text x="470" y="374" class="small">HTTP 127.0.0.1:8080</text>
  <text x="860" y="300" class="small">/predict -&gt; gRPC</text>
</svg>
